<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Taghvim - تقویم</title>
    <meta name="description" content="تقویم پیشرفته جلالی (شمسی) با استایل سایبرپانک، ادغام مناسبت‌های time.ir، تبدیل تاریخ، یادداشت‌ها و آیکون سینی پویا برای ویندوز" />
    <meta property="og:title" content="Taghvim - تقویم" />
    <meta property="og:description" content="تقویم پیشرفته جلالی (شمسی) با استایل سایبرپانک، ادغام مناسبت‌های time.ir، تبدیل تاریخ، یادداشت‌ها و آیکون سینی پویا برای ویندوز" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" href="/src/assets/fonts/digikala.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body class="bg-[#07080b] text-[#e6e9ef] selection:bg-[#22d3ee] selection:text-[#0d0f14] overflow-hidden">
    <div id="root"></div>
    <script>
      (function () {
        var boot = (window.__TAGHVIM_BOOT__ = {
          startedAt: Date.now(),
          reactMounted: false,
          stages: [],
          errors: [],
        });
        function recordStage(stage, detail) {
          boot.stages.push({
            stage: stage,
            detail: detail || '',
            elapsedMs: Date.now() - boot.startedAt,
          });
        }
        window.__taghvimRecordStage = recordStage;
        recordStage('html_boot_watchdog_installed', navigator.userAgent);

        function esc(str) {
          return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
        }

        function showBootFailure(title, message) {
          var root = document.getElementById('root');
          if (!root || boot.reactMounted) return;
          var summary = boot.stages
            .map(function (s) {
              return '[' + s.elapsedMs + 'ms] ' + s.stage + (s.detail ? ': ' + s.detail : '');
            })
            .join('\n');
          var errs = boot.errors.join('\n');
          root.innerHTML =
            '<div dir="rtl" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:#0d0f14;color:#e6e9ef;font-family:sans-serif;overflow:auto;">' +
            '<div style="width:100%;max-width:440px;padding:20px;border-radius:16px;background:#14171f;border:1px solid rgba(239,68,68,0.4);text-align:center;">' +
            '<h1 style="font-size:17px;color:#f87171;margin:0 0 10px;">' + esc(title) + '</h1>' +
            '<p style="font-size:13px;color:#9ca3af;line-height:1.6;margin:0 0 12px;">' + esc(message) + '</p>' +
            '<pre dir="ltr" style="max-height:160px;overflow:auto;text-align:left;font-size:11px;background:#0a0c10;color:#fca5a5;padding:10px;border-radius:8px;border:1px solid #232834;white-space:pre-wrap;word-break:break-word;margin:0 0 14px;">' +
            esc((errs ? errs + '\n\n' : '') + summary) +
            '</pre>' +
            '<button onclick="window.location.reload()" style="width:100%;padding:12px;border-radius:10px;background:#22d3ee;color:#0d0f14;font-weight:bold;border:none;cursor:pointer;">بارگذاری مجدد</button>' +
            '</div></div>';
        }

        window.addEventListener('error', function (ev) {
          var msg = ev && ev.message ? ev.message : 'Unknown window error';
          boot.errors.push('error: ' + msg);
          if (!boot.reactMounted) {
            showBootFailure('خطا در بارگذاری اولیه برنامه', msg);
          }
        });

        window.addEventListener('unhandledrejection', function (ev) {
          var reason = ev && ev.reason ? (ev.reason.message || String(ev.reason)) : 'Unhandled rejection';
          boot.errors.push('rejection: ' + reason);
          if (!boot.reactMounted) {
            showBootFailure('خطا در راه‌اندازی ماژول‌ها', reason);
          }
        });

        setTimeout(function () {
          if (!boot.reactMounted) {
            boot.errors.push('timeout: React failed to mount within 6000ms');
            showBootFailure(
              'تاخیر در راه‌اندازی رابط کاربری',
              'برنامه نتوانست رابط کاربری را در زمان مورد انتظار بارگذاری کند.'
            );
          }
        }, 6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
