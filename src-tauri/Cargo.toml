[package]
name = "taghvim"
version = "0.0.1"
description = "Taghvim - Persian Calendar Application for Windows"
authors = ["Taghvim Developer"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "taghvim_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "~2.7.0", features = [] }

[dependencies]
tauri = { version = "~2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "~2.7.0"
tauri-plugin-global-shortcut = "~2.4.1"
tauri-plugin-notification = "~2.8.1"
tauri-plugin-log = "~2.10"
fontdue = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.20"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
