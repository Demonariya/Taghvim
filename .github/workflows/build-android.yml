name: Build Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight checks
        run: |
          FAILED=0

          # 1. Exactly one lockfile exists and it is package-lock.json
          if [ ! -f "package-lock.json" ]; then
            echo "::error::Preflight check failed: package-lock.json does not exist."
            FAILED=1
          fi
          for lock in "bun.lock" "bun.lockb" "yarn.lock" "pnpm-lock.yaml"; do
            if [ -f "$lock" ]; then
              echo "::error::Preflight check failed: Forbidden lockfile '$lock' found in repository."
              FAILED=1
            fi
          done

          # 2. tauri.conf.json commands and package.json scripts contain no bun, pnpm or yarn
          node -e '
            const pkg = require("./package.json");
            const conf = require("./src-tauri/tauri.conf.json");
            const forbidden = ["bun", "pnpm", "yarn"];
            let bad = false;
            for (const [name, script] of Object.entries(pkg.scripts || {})) {
              for (const tool of forbidden) {
                if (new RegExp("\\b" + tool + "\\b").test(script)) {
                  console.log(`::error::Preflight check failed: package.json script "${name}" contains forbidden tool "${tool}": ${script}`);
                  bad = true;
                }
              }
            }
            const cmds = [conf.build?.beforeBuildCommand, conf.build?.beforeDevCommand].filter(Boolean);
            for (const cmd of cmds) {
              for (const tool of forbidden) {
                if (new RegExp("\\b" + tool + "\\b").test(cmd)) {
                  console.log(`::error::Preflight check failed: tauri.conf.json command contains forbidden tool "${tool}": ${cmd}`);
                  bad = true;
                }
              }
            }
            if (bad) process.exit(1);
          ' || FAILED=1

          # 3. PNG icons listed in tauri.conf.json exist
          node -e '
            const fs = require("fs");
            const path = require("path");
            const conf = require("./src-tauri/tauri.conf.json");
            let bad = false;
            for (const icon of conf.bundle?.icon || []) {
              if (icon.endsWith(".png")) {
                const p = path.join("src-tauri", icon);
                if (!fs.existsSync(p)) {
                  console.log(`::error::Preflight check failed: Icon file "${p}" not found.`);
                  bad = true;
                }
              }
            }
            if (bad) process.exit(1);
          ' || FAILED=1

          # 4. src/assets/fonts/digikala.ttf exists and is the ONLY font file under src/assets/fonts/
          if [ ! -f "src/assets/fonts/digikala.ttf" ]; then
            echo "::error::Preflight check failed: src/assets/fonts/digikala.ttf does not exist."
            FAILED=1
          fi
          EXTRA_FONTS=$(find src/assets/fonts -maxdepth 1 -type f ! -name "digikala.ttf")
          if [ -n "$EXTRA_FONTS" ]; then
            echo "::error::Preflight check failed: Unexpected extra font files found in src/assets/fonts/: $EXTRA_FONTS"
            FAILED=1
          fi

          # 5. Version matches across package.json, tauri.conf.json, and Cargo.toml; on tag pushes tag equals v<version>
          node -e '
            const fs = require("fs");
            const pkg = require("./package.json");
            const conf = require("./src-tauri/tauri.conf.json");
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            const match = cargo.match(/\[package\][\s\S]*?version\s*=\s*"([^"]+)"/);
            const cargoVersion = match ? match[1] : null;

            if (!cargoVersion) {
              console.log("::error::Preflight check failed: Could not parse version from src-tauri/Cargo.toml.");
              process.exit(1);
            }
            if (pkg.version !== conf.version || pkg.version !== cargoVersion) {
              console.log(`::error::Preflight check failed: Version mismatch across package.json (${pkg.version}), tauri.conf.json (${conf.version}), Cargo.toml (${cargoVersion}).`);
              process.exit(1);
            }
            if (process.env.GITHUB_REF_TYPE === "tag") {
              const expectedTag = "v" + pkg.version;
              const actualTag = process.env.GITHUB_REF_NAME;
              if (actualTag !== expectedTag) {
                console.log(`::error::Preflight check failed: Tag "${actualTag}" does not match manifest version tag "${expectedTag}".`);
                process.exit(1);
              }
            }
            console.log(`Preflight check passed: Versions match across all manifests (${pkg.version}).`);
          ' || FAILED=1

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install stable Rust toolchain for Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and configure environment
        run: |
          # Using NDK 26.1.10909125 (LTS r26b) for Tauri 2 Android toolchain compatibility [uncertain]
          yes | sdkmanager "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "taghvim-android"
          cache-on-failure: true

      - name: Install npm dependencies
        run: npm ci

      - name: Extract Taghvim version
        run: |
          VERSION=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION (tag: v$VERSION)"

      - name: Initialize Tauri Android project if not committed
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "src-tauri/gen/android not found. Running tauri android init..."
            npm run tauri android init -- --ci
          else
            echo "src-tauri/gen/android already present."
          fi

      - name: Build and Sign Android APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Check whether signing secrets are configured
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "Production Android keystore secrets found. Building release APK..."
            npm run tauri android build -- --apk --target aarch64 --target armv7

            RAW_APK=$(find src-tauri/gen/android -name "*.apk" | grep -i "release" | head -n 1)
            if [ -z "$RAW_APK" ]; then
              RAW_APK=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
            fi

            if [ -z "$RAW_APK" ]; then
              echo "::error::No APK produced by Tauri Android build!"
              exit 1
            fi

            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
            APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

            OUTPUT_APK="Taghvim_${VERSION}_android.apk"
            "$APKSIGNER" sign \
              --ks release.keystore \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASS" \
              --out "$OUTPUT_APK" \
              "$RAW_APK"
            rm -f release.keystore
            echo "Generated signed release APK: $OUTPUT_APK"
            echo "OUTPUT_APK=$OUTPUT_APK" >> $GITHUB_ENV
          else
            echo "No keystore secrets detected. Building installable debug-signed APK..."
            npm run tauri android build -- --apk --debug --target aarch64 --target armv7

            RAW_APK=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
            if [ -z "$RAW_APK" ]; then
              echo "::error::No debug APK produced by Tauri Android build!"
              exit 1
            fi

            OUTPUT_APK="Taghvim_${VERSION}_android-debug.apk"
            cp "$RAW_APK" "$OUTPUT_APK"
            echo "Generated debug-signed APK: $OUTPUT_APK"
            echo "OUTPUT_APK=$OUTPUT_APK" >> $GITHUB_ENV
          fi

      - name: Attach Android APK to GitHub Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Ensuring draft release $TAG exists..."
          gh release view "$TAG" || gh release create "$TAG" --draft --title "Taghvim v$VERSION"
          echo "Uploading $OUTPUT_APK to release $TAG..."
          gh release upload "$TAG" "$OUTPUT_APK" --clobber

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taghvim-Android-APK
          path: ${{ env.OUTPUT_APK }}
          if-no-files-found: error
