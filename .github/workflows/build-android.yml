# package-lock.json MUST be generated by a plain npm install and committed whole; never delete it or let CI regenerate it, as npm issue #4828 will drop the Windows native optional packages (@tauri-apps/cli-win32-x64-msvc, etc.).
#
# Android Icon & Native Overlay Pipeline:
# 1. Master icon is authored under src-tauri/icons/icon.png and Android adaptive layers are in src-tauri/icons/android/.
# 2. When CI runs `tauri android init --ci`, the Android project template is generated in src-tauri/gen/android.
# 3. `node scripts/configure-android.mjs` patches AndroidManifest.xml, syncs src-tauri/icons/android/*, installs MainActivity.kt & proguard-rules.pro, and disables AGP 8/9 R8 shrinking.
# 4. Post-build verification validates ABIs, permissions, adaptive icon XML tree, Pillow pixel match, zipalign, and apksigner.

name: Build Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight checks
        run: |
          FAILED=0

          # 1. Exactly one lockfile exists and it is package-lock.json
          if [ ! -f "package-lock.json" ]; then
            echo "::error::Preflight check failed: package-lock.json does not exist."
            FAILED=1
          fi
          for lock in "bun.lock" "bun.lockb" "yarn.lock" "pnpm-lock.yaml"; do
            if [ -f "$lock" ]; then
              echo "::error::Preflight check failed: Forbidden lockfile '$lock' found in repository."
              FAILED=1
            fi
          done

          # 1b. Verify package-lock.json contains required Linux native optional packages
          node -e '
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const required = [
              "node_modules/@tauri-apps/cli-linux-x64-gnu",
              "node_modules/@rolldown/binding-linux-x64-gnu",
              "node_modules/@tailwindcss/oxide-linux-x64-gnu",
              "node_modules/lightningcss-linux-x64-gnu"
            ];
            const missing = required.filter(p => !lock.packages || !lock.packages[p]);
            if (missing.length > 0) {
              console.log("::error::Preflight check failed: package-lock.json is missing required Linux native packages: " + missing.join(", "));
              console.log("::error::Regenerate package-lock.json with npm install and commit it.");
              process.exit(1);
            }
          ' || FAILED=1

          # 2. Tauri configs and package.json scripts contain no bun, pnpm or yarn
          node -e '
            const pkg = require("./package.json");
            const conf = require("./src-tauri/tauri.conf.json");
            const androidConf = require("./src-tauri/tauri.android.conf.json");
            const forbidden = ["bun", "pnpm", "yarn"];
            let bad = false;
            for (const [name, script] of Object.entries(pkg.scripts || {})) {
              for (const tool of forbidden) {
                if (new RegExp("\\b" + tool + "\\b").test(script)) {
                  console.log(`::error::Preflight check failed: package.json script "${name}" contains forbidden tool "${tool}": ${script}`);
                  bad = true;
                }
              }
            }
            const cmds = [
              conf.build?.beforeBuildCommand,
              conf.build?.beforeDevCommand,
              androidConf.build?.beforeBuildCommand,
              androidConf.build?.beforeDevCommand,
            ].filter(Boolean);
            for (const cmd of cmds) {
              for (const tool of forbidden) {
                if (new RegExp("\\b" + tool + "\\b").test(cmd)) {
                  console.log(`::error::Preflight check failed: Tauri config command contains forbidden tool "${tool}": ${cmd}`);
                  bad = true;
                }
              }
            }
            if (bad) process.exit(1);
          ' || FAILED=1

          # 3. PNG icons listed in tauri.conf.json and Android adaptive icon files exist
          node -e '
            const fs = require("fs");
            const path = require("path");
            const conf = require("./src-tauri/tauri.conf.json");
            let bad = false;
            for (const icon of conf.bundle?.icon || []) {
              if (icon.endsWith(".png")) {
                const p = path.join("src-tauri", icon);
                if (!fs.existsSync(p)) {
                  console.log(`::error::Preflight check failed: Icon file "${p}" not found.`);
                  bad = true;
                }
              }
            }
            const requiredAndroid = [
              "src-tauri/icons/android/mipmap-anydpi-v26/ic_launcher.xml",
              "src-tauri/icons/android/mipmap-anydpi-v26/ic_launcher_round.xml",
              "src-tauri/icons/android/values/ic_launcher_background.xml"
            ];
            for (const p of requiredAndroid) {
              if (!fs.existsSync(p)) {
                console.log(`::error::Preflight check failed: Android icon asset "${p}" not found.`);
                bad = true;
              }
            }
            if (bad) process.exit(1);
          ' || FAILED=1

          # 4. src/assets/fonts/digikala.ttf exists and is the ONLY font file under src/assets/fonts/
          if [ ! -f "src/assets/fonts/digikala.ttf" ]; then
            echo "::error::Preflight check failed: src/assets/fonts/digikala.ttf does not exist."
            FAILED=1
          fi
          EXTRA_FONTS=$(find src/assets/fonts -maxdepth 1 -type f ! -name "digikala.ttf")
          if [ -n "$EXTRA_FONTS" ]; then
            echo "::error::Preflight check failed: Unexpected extra font files found in src/assets/fonts/: $EXTRA_FONTS"
            FAILED=1
          fi

          # 5. Version matches across package.json, tauri.conf.json, and Cargo.toml; on tag pushes tag equals v<version>
          node -e '
            const fs = require("fs");
            const pkg = require("./package.json");
            const conf = require("./src-tauri/tauri.conf.json");
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            const match = cargo.match(/\[package\][\s\S]*?version\s*=\s*"([^"]+)"/);
            const cargoVersion = match ? match[1] : null;

            if (!cargoVersion) {
              console.log("::error::Preflight check failed: Could not parse version from src-tauri/Cargo.toml.");
              process.exit(1);
            }
            if (pkg.version !== conf.version || pkg.version !== cargoVersion) {
              console.log(`::error::Preflight check failed: Version mismatch across package.json (${pkg.version}), tauri.conf.json (${conf.version}), Cargo.toml (${cargoVersion}).`);
              process.exit(1);
            }
            if (process.env.GITHUB_REF_TYPE === "tag") {
              const expectedTag = "v" + pkg.version;
              const actualTag = process.env.GITHUB_REF_NAME;
              if (actualTag !== expectedTag) {
                console.log(`::error::Preflight check failed: Tag "${actualTag}" does not match manifest version tag "${expectedTag}".`);
                process.exit(1);
              }
            }
            console.log(`Preflight check passed: Versions match across all manifests (${pkg.version}).`);
          ' || FAILED=1

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install stable Rust toolchain for Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: clippy

      - name: Setup Android SDK components and licenses
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKM" ] || [ ! -x "$SDKM/sdkmanager" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME/cmdline-tools/*/bin"
            exit 1
          fi
          echo "$SDKM" >> "$GITHUB_PATH"
          export PATH="$SDKM:$PATH"
          echo "sdkmanager: $(command -v sdkmanager)"

          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses || true

          NN=34
          if [ -f "src-tauri/gen/android/app/build.gradle.kts" ]; then
            PARSED_NN=$(grep -oE "compileSdk\s*=\s*[0-9]+" src-tauri/gen/android/app/build.gradle.kts | grep -oE "[0-9]+" | head -n 1)
            [ -n "$PARSED_NN" ] && NN=$PARSED_NN
          elif [ -f "src-tauri/gen/android/app/build.gradle" ]; then
            PARSED_NN=$(grep -oE "compileSdkVersion\s+[0-9]+" src-tauri/gen/android/app/build.gradle | grep -oE "[0-9]+" | head -n 1)
            [ -n "$PARSED_NN" ] && NN=$PARSED_NN
          fi
          echo "Selected Android API level: $NN"

          echo "Installing platform-tools, platforms;android-$NN, and build-tools;$NN.0.0..."
          if ! sdkmanager --install "platform-tools" "platforms;android-$NN" "build-tools;$NN.0.0"; then
            echo "::error::Failed to install requested Android SDK packages. Listing installed packages:"
            sdkmanager --list_installed
            exit 1
          fi

      - name: Configure Android NDK
        run: |
          TARGET_NDK=""
          if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "Using runner preinstalled NDK from ANDROID_NDK_LATEST_HOME: $ANDROID_NDK_LATEST_HOME"
            TARGET_NDK="$ANDROID_NDK_LATEST_HOME"
          elif [ -d "$ANDROID_HOME/ndk" ] && [ -n "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            LATEST_INSTALLED_NDK=$(ls -d "$ANDROID_HOME/ndk/"* | sort -V | tail -n 1)
            echo "Found installed NDK: $LATEST_INSTALLED_NDK"
            TARGET_NDK="$LATEST_INSTALLED_NDK"
          else
            echo "No preinstalled NDK found. Installing specific NDK 26.1.10909125 via sdkmanager..."
            yes | sdkmanager --install "ndk;26.1.10909125"
            if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
              TARGET_NDK="$ANDROID_HOME/ndk/26.1.10909125"
            fi
          fi

          if [ -z "$TARGET_NDK" ] || [ ! -d "$TARGET_NDK" ]; then
            echo "::error::NDK directory not found at '$TARGET_NDK'! NDK configuration failed."
            exit 1
          fi

          echo "Configuring NDK_HOME and ANDROID_NDK_HOME to $TARGET_NDK"
          echo "NDK_HOME=$TARGET_NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$TARGET_NDK" >> $GITHUB_ENV

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "taghvim-android"
          cache-on-failure: true

      - name: Install npm dependencies and verify native tooling
        run: |
          if ! npm ci; then
            echo "::error::npm ci failed."
            exit 1
          fi

          if ! node -e "require('@tauri-apps/cli')"; then
            echo "::error::package-lock.json is missing native packages for this OS. Regenerate it with 'npm install' (not on a different OS's node_modules) and commit it."
            exit 1
          fi

          if ! npm ls @tauri-apps/cli; then
            echo "::error::npm ls @tauri-apps/cli verification failed."
            exit 1
          fi

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run frontend unit tests
        run: npm test

      - name: Android frontend build check
        run: npm run build:android

      - name: Run Rust unit tests (shared modules)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Run Android Clippy check
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android --lib -- -D warnings

      - name: Extract Taghvim version
        run: |
          VERSION=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION (tag: v$VERSION)"

      - name: Initialize and configure Tauri Android project
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "src-tauri/gen/android not found. Running tauri android init..."
            npm run tauri android init -- --ci
          else
            echo "src-tauri/gen/android already present."
          fi

          node scripts/configure-android.mjs

      - name: Build, ZipAlign, and Sign Android APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "Production Android keystore secrets found. Building release APK..."
            npm run tauri android build -- --apk --target aarch64 --target armv7 --target x86_64 --ignore-version-mismatches

            RAW_APK=$(find src-tauri/gen/android -type f -name "*universal*release*.apk" | sort | head -n 1)
            if [ -z "$RAW_APK" ]; then
              RAW_APK=$(find src-tauri/gen/android -type f -name "*release*.apk" | sort | head -n 1)
            fi

            if [ -z "$RAW_APK" ]; then
              echo "::error::No release APK produced by Tauri Android build!"
              exit 1
            fi
            echo "Selected raw release APK: $RAW_APK"

            ALIGNED_APK="aligned-release.apk"
            if ! "$ZIPALIGN" -P 16 -p -f 4 "$RAW_APK" "$ALIGNED_APK" 2>/dev/null; then
              "$ZIPALIGN" -p -f 4 "$RAW_APK" "$ALIGNED_APK"
            fi

            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            OUTPUT_APK="Taghvim_${VERSION}_android.apk"
            "$APKSIGNER" sign \
              --ks release.keystore \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASS" \
              --out "$OUTPUT_APK" \
              "$ALIGNED_APK"
            rm -f release.keystore "$ALIGNED_APK"
            echo "Generated signed release APK: $OUTPUT_APK"
            echo "OUTPUT_APK=$OUTPUT_APK" >> $GITHUB_ENV
          else
            echo "No keystore secrets detected. Building installable debug-signed APK..."
            npm run tauri android build -- --apk --debug --target aarch64 --target armv7 --target x86_64 --ignore-version-mismatches

            RAW_APK=$(find src-tauri/gen/android -type f -name "*universal*debug*.apk" | sort | head -n 1)
            if [ -z "$RAW_APK" ]; then
              RAW_APK=$(find src-tauri/gen/android -type f -name "*.apk" | sort | head -n 1)
            fi
            if [ -z "$RAW_APK" ]; then
              echo "::error::No debug APK produced by Tauri Android build!"
              exit 1
            fi

            OUTPUT_APK="Taghvim_${VERSION}_android-debug.apk"
            if ! "$ZIPALIGN" -P 16 -p -f 4 "$RAW_APK" "$OUTPUT_APK" 2>/dev/null; then
              "$ZIPALIGN" -p -f 4 "$RAW_APK" "$OUTPUT_APK"
            fi
            echo "Generated debug-signed APK: $OUTPUT_APK"
            echo "OUTPUT_APK=$OUTPUT_APK" >> $GITHUB_ENV
          fi

      - name: Comprehensive APK Verification
        run: |
          echo "=== Starting Comprehensive APK Verification ==="
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          AAPT="$BUILD_TOOLS_DIR/aapt"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"
          echo "Target APK: $OUTPUT_APK"

          # 1. Check native ABIs inside APK
          echo "--- 1. Checking Native Shared Libraries (libtaghvim_lib.so) ---"
          APK_CONTENTS=$(unzip -l "$OUTPUT_APK")
          echo "$APK_CONTENTS" | grep "libtaghvim_lib.so" || { echo "::error::Verification failed: libtaghvim_lib.so not found in APK"; exit 1; }

          for ABI in "arm64-v8a" "armeabi-v7a" "x86_64"; do
            if ! echo "$APK_CONTENTS" | grep -q "lib/$ABI/libtaghvim_lib.so"; then
              echo "::error::Verification failed: Missing native library for ABI $ABI in $OUTPUT_APK"
              exit 1
            fi
            echo "Verified ABI: $ABI -> lib/$ABI/libtaghvim_lib.so present"
          done

          # 2. Check package name, SDK levels, activity, and permissions from badging
          echo "--- 2. Checking Package Name, Activity, and Permissions ---"
          BADGING=$("$AAPT" dump badging "$OUTPUT_APK")
          echo "$BADGING" | grep -q "package: name='com.taghvim.calendar'" || { echo "::error::Package name mismatch"; exit 1; }
          echo "$BADGING" | grep -q "sdkVersion:'24'" || { echo "::error::minSdkVersion mismatch (expected 24)"; exit 1; }
          echo "$BADGING" | grep -q "launchable-activity: name='com.taghvim.calendar.MainActivity'" || { echo "::error::MainActivity launchable-activity missing"; exit 1; }
          echo "$BADGING" | grep -q "android.permission.INTERNET" || { echo "::error::Missing INTERNET permission"; exit 1; }
          echo "$BADGING" | grep -q "android.permission.POST_NOTIFICATIONS" || { echo "::error::Missing POST_NOTIFICATIONS permission"; exit 1; }
          echo "Verified: Package name, minSdk 24, MainActivity, INTERNET, and POST_NOTIFICATIONS present."

          # 3. Verifying launcher icon badging, adaptive XML tree, background color, and Pillow pixel matching
          echo "--- 3. Verifying Launcher Icons (aapt2 & Pillow pixel comparison) ---"
          echo "$BADGING" | grep -E "application-icon|icon=" || true
          ICON_PATH=$(echo "$BADGING" | grep "^application:" | sed -n "s/.*icon='\([^']*\)'.*/\1/p")
          if [ -z "$ICON_PATH" ]; then
            echo "::error::Verification failed: application icon path missing in aapt badging"
            exit 1
          fi
          echo "Declared icon path: $ICON_PATH"

          XML_TREE=$("$AAPT2" dump xmltree --file "$ICON_PATH" "$OUTPUT_APK")
          echo "$XML_TREE"
          echo "$XML_TREE" | grep -q "adaptive-icon" || { echo "::error::Declared icon XML is not an adaptive-icon"; exit 1; }
          echo "$XML_TREE" | grep -q "foreground" || { echo "::error::Adaptive icon missing foreground layer"; exit 1; }
          echo "$XML_TREE" | grep -q "background" || { echo "::error::Adaptive icon missing background layer"; exit 1; }

          "$AAPT" dump --values resources "$OUTPUT_APK" | grep -qi "ff081017" || {
            echo "::error::Adaptive icon background color #ff081017 not found in compiled APK resources";
            exit 1;
          }

          python3 -m pip install --user pillow || python3 -m pip install --user --break-system-packages pillow

          python3 - << 'PYEOF'
          import os
          import sys
          import tempfile
          from PIL import Image, ImageChops

          apk_path = os.environ.get("OUTPUT_APK")
          if not apk_path or not os.path.isfile(apk_path):
              print(f"::error::Target APK not found at: {apk_path}")
              sys.exit(1)

          repo_icons_dir = "src-tauri/icons/android"
          if not os.path.isdir(repo_icons_dir):
              print(f"::error::Repo icon directory not found: {repo_icons_dir}")
              sys.exit(1)

          def normalize_rgba(img: Image.Image) -> Image.Image:
              rgba = img.convert("RGBA")
              pixels = rgba.load()
              w, h = rgba.size
              for y in range(h):
                  for x in range(w):
                      r, g, b, a = pixels[x, y]
                      if a == 0:
                          pixels[x, y] = (0, 0, 0, 0)
              return rgba

          repo_icons = []
          for root, _, files in os.walk(repo_icons_dir):
              for f in files:
                  if f.endswith(".png"):
                      p = os.path.join(root, f)
                      repo_icons.append((f, p, normalize_rgba(Image.open(p))))

          print(f"Loaded {len(repo_icons)} reference icons from {repo_icons_dir}.")

          matched_foreground = 0
          matched_launcher = 0

          with tempfile.TemporaryDirectory() as tmpdir:
              os.system(f'unzip -q "{apk_path}" -d "{tmpdir}"')
              apk_png_paths = []
              for root, _, files in os.walk(tmpdir):
                  for f in files:
                      if f.endswith(".png"):
                          apk_png_paths.append(os.path.join(root, f))

              print(f"Extracted {len(apk_png_paths)} PNG images from APK.")

              for apk_png in apk_png_paths:
                  try:
                      apk_img = normalize_rgba(Image.open(apk_png))
                  except Exception:
                      continue

                  for ref_name, ref_path, ref_img in repo_icons:
                      if apk_img.size == ref_img.size:
                          diff = ImageChops.difference(apk_img, ref_img)
                          extrema = diff.getextrema()
                          max_diff = max(ch[1] for ch in extrema)
                          if max_diff <= 2:
                              rel_apk = os.path.relpath(apk_png, tmpdir)
                              print(f"Pixel match (max_diff={max_diff}): APK '{rel_apk}' matches repo '{ref_path}' ({ref_img.size[0]}x{ref_img.size[1]})")
                              if "ic_launcher_foreground" in ref_name:
                                  matched_foreground += 1
                              if "ic_launcher.png" in ref_name or "ic_launcher_round.png" in ref_name:
                                  matched_launcher += 1

          print(f"Pixel match summary: foreground={matched_foreground}, launcher/round={matched_launcher}")

          if matched_foreground == 0:
              print("::error::Verification failed: At least one ic_launcher_foreground pixel match is required!")
              sys.exit(1)

          if matched_launcher == 0:
              print("::error::Verification failed: At least one ic_launcher.png pixel match is required!")
              sys.exit(1)

          print("Launcher icon verification passed: APK contains authentic launcher icons matching repository originals.")
          PYEOF

          # 4. Check zipalign 4-byte alignment
          echo "--- 4. Checking ZipAlign ---"
          if ! "$ZIPALIGN" -c -v 4 "$OUTPUT_APK"; then
            echo "::error::Verification failed: APK is not properly 4-byte aligned (zipalign failed)"
            exit 1
          fi
          echo "Verified: ZipAlign check passed."

          # 5. Check apksigner verification
          echo "--- 5. Checking APK Signature ---"
          if ! "$APKSIGNER" verify --verbose "$OUTPUT_APK"; then
            echo "::error::Verification failed: apksigner verification failed for $OUTPUT_APK"
            exit 1
          fi
          echo "Verified: apksigner verification passed."
          echo "=== All Comprehensive APK Verifications Passed Successfully ==="

      - name: Attach Android APK to GitHub Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Ensuring draft release $TAG exists..."
          gh release view "$TAG" || gh release create "$TAG" --draft --title "Taghvim v$VERSION"
          echo "Uploading $OUTPUT_APK to release $TAG..."
          gh release upload "$TAG" "$OUTPUT_APK" --clobber

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taghvim-Android-APK
          path: ${{ env.OUTPUT_APK }}
          if-no-files-found: error

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== Diagnostic Information ==="
          echo "Node version: $(node -v)"
          echo "npm version: $(npm -v)"
          echo "rustc version: $(rustc -V)"
          echo "cargo version: $(cargo -V)"
          echo "Java version:"
          java -version 2>&1
          echo "Android environment paths:"
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "NDK_HOME: $NDK_HOME"
          echo "PATH: $PATH"
          echo "=== Installed SDK packages ==="
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager --list_installed 2>&1 || true
          else
            echo "sdkmanager not found on PATH"
          fi
          echo "=== npm dependencies (depth=0, top 40 lines) ==="
          npm ls --depth=0 2>&1 | head -n 40

  verify-android-emulator:
    needs: build-android
    runs-on: ubuntu-latest

    steps:
      - name: Download built APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Taghvim-Android-APK
          path: apk-artifact

      - name: Check KVM hardware acceleration availability
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "KVM acceleration is available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: /dev/kvm is unavailable on this runner; skipping live Android emulator boot test."
          fi

      - name: Boot Android Emulator and verify Taghvim launch
        if: steps.kvm.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            APK_FILE=$(find apk-artifact -maxdepth 1 -name "*.apk" | head -n 1)
            echo "Installing $APK_FILE..."
            adb install -r "$APK_FILE"
            adb logcat -c
            echo "Launching com.taghvim.calendar/.MainActivity..."
            adb shell am start -W -n com.taghvim.calendar/.MainActivity
            sleep 8
            APP_PID=$(adb shell pidof com.taghvim.calendar || true)
            echo "Running PID: ${APP_PID:-NONE}"
            adb logcat -d -s TaghvimStartup TaghvimRust AndroidRuntime Chromium
            if [ -z "$APP_PID" ]; then
              echo "::error::Taghvim process is not running 8s after launch!"
              exit 1
            fi
            if adb logcat -d | grep -qE "FATAL EXCEPTION|UnsatisfiedLinkError|dlopen failed"; then
              echo "::error::Fatal native or Java startup error detected in logcat!"
              exit 1
            fi
            echo "Android emulator launch verification passed."
