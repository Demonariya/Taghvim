# package-lock.json MUST be generated by a plain npm install and committed whole; never delete it or let CI regenerate it, as npm issue #4828 will drop the Windows native optional packages (@tauri-apps/cli-win32-x64-msvc, etc.).
# NOTE: This workflow does not use external code-signing certificates.
# Windows SmartScreen may display an "Unknown Publisher" warning on first launch
# for the generated unsigned installer and portable executable.

name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CARGO_NET_RETRY: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight checks
        shell: pwsh
        run: |
          $failed = $false

          # 1. Exactly one lockfile exists and it is package-lock.json
          if (-not (Test-Path "package-lock.json")) {
            Write-Host "::error::Preflight check failed: package-lock.json does not exist."
            $failed = $true
          }
          $forbiddenLocks = @("bun.lock", "bun.lockb", "yarn.lock", "pnpm-lock.yaml")
          foreach ($lock in $forbiddenLocks) {
            if (Test-Path $lock) {
              Write-Host "::error::Preflight check failed: Forbidden lockfile '$lock' found in repository."
              $failed = $true
            }
          }

          # 1b. Verify package-lock.json contains required Windows native optional packages
          node -e '
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const required = [
              "node_modules/@tauri-apps/cli-win32-x64-msvc",
              "node_modules/@rolldown/binding-win32-x64-msvc",
              "node_modules/@tailwindcss/oxide-win32-x64-msvc",
              "node_modules/lightningcss-win32-x64-msvc"
            ];
            const missing = required.filter(p => !lock.packages || !lock.packages[p]);
            if (missing.length > 0) {
              console.log("::error::Preflight check failed: package-lock.json is missing required Windows native packages: " + missing.join(", "));
              console.log("::error::Regenerate package-lock.json with npm install on Windows and commit it.");
              process.exit(1);
            }
          '
          if ($LASTEXITCODE -ne 0) {
            $failed = $true
          }

          # 2. tauri.conf.json commands and package.json scripts contain no bun, pnpm or yarn
          $pkgJson = Get-Content -Raw "package.json" | ConvertFrom-Json
          $scripts = $pkgJson.scripts
          $forbiddenTools = @("bun", "pnpm", "yarn")
          foreach ($prop in $scripts.PSObject.Properties) {
            $cmd = $prop.Value
            foreach ($tool in $forbiddenTools) {
              if ($cmd -match "\b$tool\b") {
                Write-Host "::error::Preflight check failed: package.json script '$($prop.Name)' contains forbidden tool '$tool': $cmd"
                $failed = $true
              }
            }
          }
          $tauriConf = Get-Content -Raw "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $buildCmds = @($tauriConf.build.beforeBuildCommand, $tauriConf.build.beforeDevCommand)
          foreach ($cmd in $buildCmds) {
            if ($cmd) {
              foreach ($tool in $forbiddenTools) {
                if ($cmd -match "\b$tool\b") {
                  Write-Host "::error::Preflight check failed: tauri.conf.json build command contains forbidden tool '$tool': $cmd"
                  $failed = $true
                }
              }
            }
          }

          # 3. src-tauri/icons/icon.ico exists (Windows) and PNG icons listed in config exist
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            Write-Host "::error::Preflight check failed: Windows icon 'src-tauri/icons/icon.ico' does not exist."
            $failed = $true
          }
          if ($tauriConf.bundle -and $tauriConf.bundle.icon) {
            foreach ($iconPath in $tauriConf.bundle.icon) {
              if ($iconPath.EndsWith(".png")) {
                $fullPath = "src-tauri/$iconPath"
                if (-not (Test-Path $fullPath)) {
                  Write-Host "::error::Preflight check failed: Required icon '$fullPath' specified in tauri.conf.json does not exist."
                  $failed = $true
                }
              }
            }
          }

          # 4. src/assets/fonts/digikala.ttf exists, and is the ONLY font file under src/assets/fonts/
          if (-not (Test-Path "src/assets/fonts/digikala.ttf")) {
            Write-Host "::error::Preflight check failed: Required font 'src/assets/fonts/digikala.ttf' does not exist."
            $failed = $true
          }
          $fontFiles = Get-ChildItem -Path "src/assets/fonts" -File
          foreach ($f in $fontFiles) {
            if ($f.Name -ne "digikala.ttf") {
              Write-Host "::error::Preflight check failed: Unexpected extra font file found: src/assets/fonts/$($f.Name)"
              $failed = $true
            }
          }

          # 5. Versions in tauri.conf.json, package.json, and src-tauri/Cargo.toml match; on tag pushes, tag equals v<version>
          $pkgVersion = $pkgJson.version
          $tauriVersion = $tauriConf.version
          $cargoContent = Get-Content -Raw "src-tauri/Cargo.toml"
          $cargoVersion = $null
          if ($cargoContent -match '\[package\][\s\S]*?version\s*=\s*"([^"]+)"') {
            $cargoVersion = $matches[1]
          } else {
            Write-Host "::error::Preflight check failed: Could not parse package version from src-tauri/Cargo.toml."
            $failed = $true
          }

          if ($pkgVersion -ne $tauriVersion -or $pkgVersion -ne $cargoVersion) {
            Write-Host "::error::Preflight check failed: Version mismatch across manifests - package.json ($pkgVersion), tauri.conf.json ($tauriVersion), Cargo.toml ($cargoVersion)."
            $failed = $true
          } else {
            Write-Host "Preflight check passed: Versions match across all manifests ($pkgVersion)."
          }

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $expectedTag = "v$pkgVersion"
            $actualTag = $env:GITHUB_REF_NAME
            if ($actualTag -ne $expectedTag) {
              Write-Host "::error::Preflight check failed: Git tag '$actualTag' does not match manifest version expected tag '$expectedTag'."
              $failed = $true
            }
          }

          # 6. Extract and verify binary name from src-tauri/Cargo.toml [package] name
          if ($cargoContent -match '\[package\][\s\S]*?name\s*=\s*"([^"]+)"') {
            $binName = $matches[1]
            Write-Host "Preflight check passed: Binary name detected as '$binName'."
          } else {
            Write-Host "::error::Preflight check failed: Could not parse [package] name from src-tauri/Cargo.toml."
            $failed = $true
          }

          if ($failed) {
            exit 1
          }

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "taghvim-win"
          cache-on-failure: true
          save-if: ${{ github.ref_type == 'tag' || github.ref == 'refs/heads/main' }}

      - name: Install npm dependencies and verify native tooling
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::npm ci failed."
            exit 1
          }

          node -e "require('@tauri-apps/cli')"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::package-lock.json is missing native packages for this OS. Regenerate it with 'npm install' (not on a different OS's node_modules) and commit it."
            exit 1
          }

          npm ls @tauri-apps/cli
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::npm ls @tauri-apps/cli verification failed."
            exit 1
          }

      - name: Frontend build check
        run: npm run build

      - name: Extract version and tag
        shell: pwsh
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          if (-not (Test-Path $configPath)) {
            Write-Error "Config file not found at $configPath"
            exit 1
          }
          $conf = Get-Content -Raw $configPath | ConvertFrom-Json
          $version = $conf.version
          if (-not $version) {
            Write-Error "Failed to extract 'version' from $configPath"
            exit 1
          }
          Write-Host "Resolved version: $version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Tauri app and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ env.TAG }}
          releaseName: "Taghvim v${{ env.VERSION }}"
          releaseDraft: true
          tauriScript: npm run tauri
          args: --bundles nsis --ignore-version-mismatches

      - name: Prepare and attach portable executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $cargoContent = Get-Content -Raw "src-tauri/Cargo.toml"
          if ($cargoContent -match '\[package\][\s\S]*?name\s*=\s*"([^"]+)"') {
            $binName = $matches[1]
          } else {
            Write-Error "Could not parse [package] name from src-tauri/Cargo.toml"
            exit 1
          }

          $portableSrc = "src-tauri/target/release/$binName.exe"
          $portableDst = "Taghvim_$($env:VERSION)_x64-portable.exe"

          if (-not (Test-Path $portableSrc)) {
            Write-Error "Portable binary was not found at $portableSrc!"
            exit 1
          }

          Copy-Item -Path $portableSrc -Destination $portableDst -Force
          Write-Host "Created portable binary: $portableDst from $portableSrc"

          $nsisFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not $nsisFiles -or $nsisFiles.Count -eq 0) {
            Write-Error "NSIS setup installer was not found in src-tauri/target/release/bundle/nsis/!"
            exit 1
          }
          Write-Host "Verified NSIS setup installer: $($nsisFiles[0].FullName)"

          Write-Host "Attaching $portableDst to GitHub Release $($env:TAG)..."
          gh release upload $env:TAG $portableDst --clobber

      - name: Upload artifacts (NSIS installer & portable exe)
        uses: actions/upload-artifact@v4
        with:
          name: Taghvim-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            Taghvim_*_x64-portable.exe
          if-no-files-found: error

      - name: Diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== Diagnostic Information ==="
          Write-Host "Node version: $(node -v)"
          Write-Host "npm version: $(npm -v)"
          Write-Host "rustc version: $(rustc -V)"
          Write-Host "cargo version: $(cargo -V)"
          Write-Host "=== npm dependencies (depth=0, top 40 lines) ==="
          npm ls --depth=0 2>&1 | Select-Object -First 40
