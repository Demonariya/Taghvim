# package-lock.json MUST be generated by a plain npm install and committed whole; never delete it or let CI regenerate it, as npm issue #4828 will drop the Windows native optional packages (@tauri-apps/cli-win32-x64-msvc, etc.).
# NOTE: This workflow does not use external code-signing certificates.
# Windows SmartScreen may display an "Unknown Publisher" warning on first launch
# for the generated unsigned installer and portable executable.

name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CARGO_NET_RETRY: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Preflight checks
        shell: pwsh
        run: |
          $failed = $false

          # 1. Exactly one lockfile exists and it is package-lock.json
          if (-not (Test-Path "package-lock.json")) {
            Write-Host "::error::Preflight check failed: package-lock.json does not exist."
            $failed = $true
          }
          $forbiddenLocks = @("bun.lock", "bun.lockb", "yarn.lock", "pnpm-lock.yaml")
          foreach ($lock in $forbiddenLocks) {
            if (Test-Path $lock) {
              Write-Host "::error::Preflight check failed: Forbidden lockfile '$lock' found in repository."
              $failed = $true
            }
          }

          # 1b. Verify package-lock.json contains required Windows native optional packages
          node -e '
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const required = [
              "node_modules/@tauri-apps/cli-win32-x64-msvc",
              "node_modules/@rolldown/binding-win32-x64-msvc",
              "node_modules/@tailwindcss/oxide-win32-x64-msvc",
              "node_modules/lightningcss-win32-x64-msvc"
            ];
            const missing = required.filter(p => !lock.packages || !lock.packages[p]);
            if (missing.length > 0) {
              console.log("::error::Preflight check failed: package-lock.json is missing required Windows native packages: " + missing.join(", "));
              console.log("::error::Regenerate package-lock.json with npm install on Windows and commit it.");
              process.exit(1);
            }
          '
          if ($LASTEXITCODE -ne 0) {
            $failed = $true
          }

          # 2. Tauri configs and package.json scripts contain no bun, pnpm or yarn
          $pkgJson = Get-Content -Raw "package.json" | ConvertFrom-Json
          $scripts = $pkgJson.scripts
          $forbiddenTools = @("bun", "pnpm", "yarn")
          foreach ($prop in $scripts.PSObject.Properties) {
            $cmd = $prop.Value
            foreach ($tool in $forbiddenTools) {
              if ($cmd -match "\b$tool\b") {
                Write-Host "::error::Preflight check failed: package.json script '$($prop.Name)' contains forbidden tool '$tool': $cmd"
                $failed = $true
              }
            }
          }
          $tauriConf = Get-Content -Raw "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $buildCmds = @($tauriConf.build.beforeBuildCommand, $tauriConf.build.beforeDevCommand)
          foreach ($cmd in $buildCmds) {
            if ($cmd) {
              foreach ($tool in $forbiddenTools) {
                if ($cmd -match "\b$tool\b") {
                  Write-Host "::error::Preflight check failed: Tauri config command contains forbidden tool '$tool': $cmd"
                  $failed = $true
                }
              }
            }
          }

          # 3. src-tauri/icons/icon.ico exists with multi-resolution directory and PNG icons listed in config exist
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            Write-Host "::error::Preflight check failed: Windows icon 'src-tauri/icons/icon.ico' does not exist."
            $failed = $true
          } else {
            node -e '
              const fs = require("fs");
              const buf = fs.readFileSync("src-tauri/icons/icon.ico");
              const count = buf.readUInt16LE(4);
              if (count < 5) {
                console.error(`::error::icon.ico has only ${count} image entries; expected multi-resolution ICO.`);
                process.exit(1);
              }
              console.log(`Verified icon.ico contains ${count} resolution entries.`);
            '
            if ($LASTEXITCODE -ne 0) {
              $failed = $true
            }
          }
          if ($tauriConf.bundle -and $tauriConf.bundle.icon) {
            foreach ($iconPath in $tauriConf.bundle.icon) {
              if ($iconPath.EndsWith(".png")) {
                $fullPath = "src-tauri/$iconPath"
                if (-not (Test-Path $fullPath)) {
                  Write-Host "::error::Preflight check failed: Required icon '$fullPath' specified in tauri.conf.json does not exist."
                  $failed = $true
                }
              }
            }
          }

          # 4. src/assets/fonts/digikala.ttf exists, and is the ONLY font file under src/assets/fonts/
          if (-not (Test-Path "src/assets/fonts/digikala.ttf")) {
            Write-Host "::error::Preflight check failed: Required font 'src/assets/fonts/digikala.ttf' does not exist."
            $failed = $true
          }
          $fontFiles = Get-ChildItem -Path "src/assets/fonts" -File
          foreach ($f in $fontFiles) {
            if ($f.Name -ne "digikala.ttf") {
              Write-Host "::error::Preflight check failed: Unexpected extra font file found: src/assets/fonts/$($f.Name)"
              $failed = $true
            }
          }

          # 5. Versions in tauri.conf.json, package.json, and src-tauri/Cargo.toml match; on tag pushes, tag equals v<version>
          $pkgVersion = $pkgJson.version
          $tauriVersion = $tauriConf.version
          $cargoContent = Get-Content -Raw "src-tauri/Cargo.toml"
          $cargoVersion = $null
          if ($cargoContent -match '\[package\][\s\S]*?version\s*=\s*"([^"]+)"') {
            $cargoVersion = $matches[1]
          } else {
            Write-Host "::error::Preflight check failed: Could not parse package version from src-tauri/Cargo.toml."
            $failed = $true
          }

          if ($pkgVersion -ne $tauriVersion -or $pkgVersion -ne $cargoVersion) {
            Write-Host "::error::Preflight check failed: Version mismatch across manifests - package.json ($pkgVersion), tauri.conf.json ($tauriVersion), Cargo.toml ($cargoVersion)."
            $failed = $true
          } else {
            Write-Host "Preflight check passed: Versions match across all manifests ($pkgVersion)."
          }

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $expectedTag = "v$pkgVersion"
            $actualTag = $env:GITHUB_REF_NAME
            if ($actualTag -ne $expectedTag) {
              Write-Host "::error::Preflight check failed: Git tag '$actualTag' does not match manifest version expected tag '$expectedTag'."
              $failed = $true
            }
          }

          # 6. Extract and verify binary name from src-tauri/Cargo.toml [package] name
          if ($cargoContent -match '\[package\][\s\S]*?name\s*=\s*"([^"]+)"') {
            $binName = $matches[1]
            Write-Host "Preflight check passed: Binary name detected as '$binName'."
          } else {
            Write-Host "::error::Preflight check failed: Could not parse [package] name from src-tauri/Cargo.toml."
            $failed = $true
          }

          # 7. Verify Tauri Rust & npm minor version parity and ensure no invalid unit-plugin maps exist
          node -e '
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));

            for (const unitPlugin of ["autostart", "global-shortcut", "notification"]) {
              if (conf.plugins && conf.plugins[unitPlugin] !== undefined) {
                console.error(`::error::tauri.conf.json must not define plugins.${unitPlugin} (expected unit config).`);
                process.exit(1);
              }
            }

            const pairs = [
              ["tauri", "node_modules/@tauri-apps/api"],
              ["tauri-plugin-autostart", "node_modules/@tauri-apps/plugin-autostart"],
              ["tauri-plugin-global-shortcut", "node_modules/@tauri-apps/plugin-global-shortcut"],
              ["tauri-plugin-notification", "node_modules/@tauri-apps/plugin-notification"]
            ];

            for (const [crate, npmPkg] of pairs) {
              const m = cargo.match(new RegExp(`^${crate}\\s*=\\s*(?:"[~^=]?([0-9]+\\.[0-9]+)|\\{[^}]*version\\s*=\\s*"[~^=]?([0-9]+\\.[0-9]+))`, "m"));
              const rustMinor = m ? (m[1] || m[2]) : null;
              const npmVer = lock.packages?.[npmPkg]?.version || "";
              const npmMinor = npmVer.split(".").slice(0, 2).join(".");
              if (!rustMinor || rustMinor !== npmMinor) {
                console.error(`::error::Tauri minor version mismatch: ${crate} (${rustMinor}) vs ${npmPkg} (${npmVer})`);
                process.exit(1);
              }
              console.log(`Aligned: ${crate} (${rustMinor}.x) <-> ${npmPkg} (${npmVer})`);
            }
          '
          if ($LASTEXITCODE -ne 0) {
            $failed = $true
          }

          if ($failed) {
            exit 1
          }

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "taghvim-win"
          cache-on-failure: true
          save-if: ${{ github.ref_type == 'tag' || github.ref == 'refs/heads/main' }}

      - name: Install npm dependencies and verify native tooling
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::npm ci failed."
            exit 1
          }

          node -e "require('@tauri-apps/cli')"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::package-lock.json is missing native packages for this OS. Regenerate it with 'npm install' (not on a different OS's node_modules) and commit it."
            exit 1
          }

          npm ls @tauri-apps/cli
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::npm ls @tauri-apps/cli verification failed."
            exit 1
          }

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run frontend unit tests
        run: npm test

      - name: Windows frontend build check
        run: npm run build

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Run Windows Clippy check
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Extract version and tag
        shell: pwsh
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          if (-not (Test-Path $configPath)) {
            Write-Error "Config file not found at $configPath"
            exit 1
          }
          $conf = Get-Content -Raw $configPath | ConvertFrom-Json
          $version = $conf.version
          if (-not $version) {
            Write-Error "Failed to extract 'version' from $configPath"
            exit 1
          }
          Write-Host "Resolved version: $version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Tauri app and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ env.TAG }}
          releaseName: "Taghvim v${{ env.VERSION }}"
          releaseDraft: true
          releaseBody: |
            برای اجرای نسخه پرتابل، Microsoft WebView2 Runtime الزامی است؛ در صورت عدم اجرا از فایل نصبی (Installer) استفاده کنید.

            Portable build needs Microsoft WebView2 Runtime; use the installer if the app does not open.
          tauriScript: npm run tauri
          args: --bundles nsis

      - name: Prepare and attach portable executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $cargoContent = Get-Content -Raw "src-tauri/Cargo.toml"
          if ($cargoContent -match '\[package\][\s\S]*?name\s*=\s*"([^"]+)"') {
            $binName = $matches[1]
          } else {
            Write-Error "Could not parse [package] name from src-tauri/Cargo.toml"
            exit 1
          }

          $portableSrc = "src-tauri/target/release/$binName.exe"
          $portableDst = "Taghvim_$($env:VERSION)_x64-portable.exe"

          if (-not (Test-Path $portableSrc)) {
            Write-Error "Portable binary was not found at $portableSrc!"
            exit 1
          }

          Copy-Item -Path $portableSrc -Destination $portableDst -Force
          Write-Host "Created portable binary: $portableDst from $portableSrc"

          $nsisFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not $nsisFiles -or $nsisFiles.Count -eq 0) {
            Write-Error "NSIS setup installer was not found in src-tauri/target/release/bundle/nsis/!"
            exit 1
          }
          Write-Host "Verified NSIS setup installer: $($nsisFiles[0].FullName)"

          Write-Host "Attaching $portableDst to GitHub Release $($env:TAG)..."
          gh release upload $env:TAG $portableDst --clobber

      - name: Windows runtime smoke test (NSIS install + launched exe + portable exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $wv2Paths = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          )
          $wv2Ver = $null
          foreach ($p in $wv2Paths) {
            if (Test-Path $p) {
              $wv2Ver = (Get-ItemProperty $p -ErrorAction SilentlyContinue).pv
              if ($wv2Ver) { break }
            }
          }
          Write-Host "WebView2 Runtime detected: $(if ($wv2Ver) { $wv2Ver } else { 'not found in registry (NSIS embedBootstrapper will handle if needed)' })"

          function Stop-AllTaghvim {
            Get-Process -Name "taghvim" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Milliseconds 500
          }

          function Test-TaghvimLaunch {
            param(
              [string]$ExePath,
              [string]$ModeLabel
            )

            Stop-AllTaghvim

            $appDataDir = Join-Path $env:APPDATA "com.taghvim.calendar"
            $crashLog = Join-Path $appDataDir "crash.log"
            $tempCrashLog = Join-Path $env:TEMP "taghvim_crash.log"
            $diagFile = Join-Path $appDataDir "startup_diagnostics.json"
            $tempDiagFile = Join-Path $env:TEMP "taghvim_startup_diagnostics.json"

            Remove-Item -Path $crashLog, $tempCrashLog, $diagFile, $tempDiagFile -Force -ErrorAction SilentlyContinue

            Write-Host "=== Launching ${ModeLabel}: $ExePath ==="
            $proc = Start-Process -FilePath $ExePath -PassThru
            Start-Sleep -Seconds 7

            if ($proc.HasExited) {
              Write-Host "::error::$ModeLabel exited prematurely with code $($proc.ExitCode)"
              if (Test-Path $tempCrashLog) { Get-Content $tempCrashLog }
              if (Test-Path $crashLog) { Get-Content $crashLog }
              if (Test-Path $diagFile) { Get-Content $diagFile }
              if (Test-Path $tempDiagFile) { Get-Content $tempDiagFile }
              exit 1
            }

            try {
              if ((Test-Path $tempCrashLog) -or (Test-Path $crashLog)) {
                Write-Host "::error::$ModeLabel generated a crash log despite staying open!"
                if (Test-Path $tempCrashLog) { Get-Content $tempCrashLog }
                if (Test-Path $crashLog) { Get-Content $crashLog }
                exit 1
              }

              $resolvedDiag = if (Test-Path $diagFile) { $diagFile } elseif (Test-Path $tempDiagFile) { $tempDiagFile } else { $null }
              if (-not $resolvedDiag) {
                Write-Host "::error::$ModeLabel did not produce startup_diagnostics.json at $diagFile or $tempDiagFile"
                exit 1
              }

              $diag = Get-Content -Raw $resolvedDiag | ConvertFrom-Json
              Write-Host "$ModeLabel startup diagnostics (lastCompletedStage=$($diag.lastCompletedStage)):"
              Get-Content $resolvedDiag

              if ($diag.warnings -and $diag.warnings.Count -gt 0) {
                Write-Host "::warning::$ModeLabel startup warnings: $($diag.warnings -join '; ')"
              }

              if ($diag.errors -and $diag.errors.Count -gt 0) {
                Write-Host "::error::$ModeLabel recorded startup errors: $($diag.errors -join '; ')"
                exit 1
              }

              $stageNames = @($diag.stages | ForEach-Object { $_.stage })
              foreach ($req in @("setup_started", "main_window_ready", "app_state_managed")) {
                if ($stageNames -notcontains $req) {
                  Write-Host "::error::$ModeLabel missing required startup stage '$req'. Stages seen: $($stageNames -join ', ')"
                  exit 1
                }
              }

              Write-Host "Runtime smoke test PASSED for $ModeLabel (process alive, main_window_ready verified, 0 startup errors)."
            } finally {
              Stop-AllTaghvim
            }
          }

          $nsisSetup = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $nsisSetup) {
            throw "NSIS installer not found."
          }

          Write-Host "Installing NSIS package silently: $($nsisSetup.FullName)"
          $installProc = Start-Process -FilePath $nsisSetup.FullName -ArgumentList "/S" -PassThru
          if (-not $installProc.WaitForExit(120000)) {
            Stop-Process -Id $installProc.Id -Force -ErrorAction SilentlyContinue
            throw "NSIS silent install timed out after 120 seconds."
          }
          if ($installProc.ExitCode -ne 0) {
            throw "NSIS silent install failed with exit code $($installProc.ExitCode)"
          }

          $installedExe = Join-Path $env:LOCALAPPDATA "Taghvim\taghvim.exe"
          if (-not (Test-Path $installedExe)) {
            $fallbackExe = Get-ChildItem -Path $env:LOCALAPPDATA -Filter "taghvim.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($fallbackExe) {
              $installedExe = $fallbackExe.FullName
            } else {
              throw "Installed executable not found under $env:LOCALAPPDATA after NSIS install."
            }
          }
          Write-Host "Installation verified at: $installedExe"

          Test-TaghvimLaunch -ExePath $installedExe -ModeLabel "Installed NSIS App"

          $portableExe = Get-ChildItem -Path "Taghvim_*_x64-portable.exe" | Select-Object -First 1
          if (-not $portableExe) {
            throw "Portable executable not found."
          }
          Test-TaghvimLaunch -ExePath $portableExe.FullName -ModeLabel "Portable Executable"

      - name: Upload artifacts (NSIS installer & portable exe)
        uses: actions/upload-artifact@v6
        with:
          name: Taghvim-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            Taghvim_*_x64-portable.exe
          if-no-files-found: error

      - name: Diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== Diagnostic Information ==="
          Write-Host "Node version: $(node -v)"
          Write-Host "npm version: $(npm -v)"
          Write-Host "rustc version: $(rustc -V)"
          Write-Host "cargo version: $(cargo -V)"
          $tempCrash = Join-Path $env:TEMP "taghvim_crash.log"
          $appCrash = Join-Path $env:APPDATA "com.taghvim.calendar\crash.log"
          $diagFile = Join-Path $env:APPDATA "com.taghvim.calendar\startup_diagnostics.json"
          if (Test-Path $tempCrash) { Write-Host "=== TEMP crash.log ==="; Get-Content $tempCrash }
          if (Test-Path $appCrash) { Write-Host "=== APPDATA crash.log ==="; Get-Content $appCrash }
          if (Test-Path $diagFile) { Write-Host "=== startup_diagnostics.json ==="; Get-Content $diagFile }
          Write-Host "=== npm dependencies (depth=0, top 40 lines) ==="
          npm ls --depth=0 2>&1 | Select-Object -First 40
